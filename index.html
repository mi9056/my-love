
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для моей любимой</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow-y: auto; /* Разрешаем прокрутку, если фото много */
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 360px;
            width: 90%;
            position: relative;
            transition: all 0.5s ease; /* Плавный подъем рамки */
            margin: 20px;
        }

        /* Уведомление */
        #error-notification {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #FF0000;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 10;
        }
        #error-notification.show { top: -50px; opacity: 1; }

        /* Стили страниц */
        .page { display: none; animation: fadeIn 1s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Первая страница */
        .photo-container { width: 120px; height: 120px; margin: 0 auto 15px; }
        .main-photo { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .tg-button { display: inline-block; text-decoration: none; background-color: #ffafbd; color: white; padding: 8px 20px; border-radius: 20px; margin-bottom: 20px; }

        h1 { font-size: 1.3em; color: #d63384; margin-bottom: 20px; }
        .button-group { display: flex; flex-direction: column; gap: 12px; }
        .btn { padding: 14px; border: none; border-radius: 50px; background-color: #ffe4e9; color: #d63384; cursor: pointer; transition: 0.3s; }
        .btn.wrong { background-color: #FF0000 !important; color: white !important; pointer-events: none; }
        #third-btn { display: none; background-color: #d63384; color: white; font-weight: bold; animation: popIn 0.5s forwards; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }

        /* Финальный экран */
        .final-text { font-size: 1.1em; color: #444; line-height: 1.5; margin-bottom: 20px; }
        .date-header { font-weight: bold; color: #d63384; display: block; margin-bottom: 10px; }

        /* Кнопка Фоточки */
        #photo-trigger {
            display: none;
            background-color: #ffe4e9;
            color: #d63384;
            padding: 12px 25px;
            border: none; border-radius: 50px; cursor: pointer; font-weight: bold; animation: fadeIn 1s ease; }
            /* Галерея (Сетка) */
    .gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr); /* 3 колонки */
        gap: 10px;
        margin-top: 20px;
    }
    .gallery img {
        width: 100%;
        height: 100px;
        object-fit: cover;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    /* Последняя (11-я) картинка будет на всю ширину или по центру */
    .gallery img:last-child {
        grid-column: span 3;
        height: 150px;
    }

    /* Класс для подъема контента */
    .move-up { transform: translateY(-20px); }
</style>
<div class="container" id="main-container">
    <div id="error-notification">❌ответ не верен❌</div>

    <!-- СТРАНИЦА 1: ВОПРОС -->
    <div id="page-1" class="page" style="display: block;">
        <div class="photo-container">
            <img src="images/avatar.jpg" alt="Фото" class="main-photo">
        </div>
        <a href="https://t.me/FurryFarry" target="_blank" class="tg-button">Любимая ❤️</a>
        <h1>За что я тебя так люблю 🥰?</h1>
        <div class="button-group">
            <button class="btn" onclick="handleWrong(this)">За красоту и доброту</button>
            <button class="btn" id="third-btn" onclick="goToPage2()">За все выше перечисленное❤️</button>
            <button class="btn" onclick="handleWrong(this)">За то, что любишь меня любым</button>
        </div>
    </div>

    <!-- СТРАНИЦА 2: ФИНАЛЬНЫЙ ТЕКСТ -->
    <div id="page-2" class="page">
        <div class="final-text">
            <span class="date-header">Я навсегда запомню 25.12.25</span>
            Как Блинчик поженил меня и тебя на IronMine, и мы реально полюбили друг друга💜<br><br>
            Чтобы ни случилось, я всегда тебя поддержу💞
        </div>
        <button id="photo-trigger" onclick="showGallery()">Фоточки💘</button>
    </div>

    <!-- СТРАНИЦА 3: ГАЛЕРЕЯ -->
    <div id="page-3" class="page">
        <div class="gallery">
            <!-- 11 фоток -->
            <img src="images/1.jpg"> <img src="images/2.jpg"> <img src="images/3.jpg">
            <img src="images/4.jpg"> <img src="images/5.jpg"> <img src="images/6.jpg">
            <img src="images/7.jpg"> <img src="images/8.jpg"> <img src="images/9.jpg">
            <img src="images/10.jpg"> <img src="images/11.jpg"> <img src="images/12.jpg">
            <img src="images/13.jpg"> <!-- 11-я будет широкой -->
        </div>
    </div>
</div>

<script>
    let wrongCount = 0;

    function handleWrong(btn) {
        btn.classList.add('wrong');
        const notify = document.getElementById('error-notification');
        notify.classList.add('show');
        setTimeout(() => notify.classList.remove('show'), 1000);

        wrongCount++;
        if (wrongCount === 2) {
            document.getElementById('third-btn').style.display = 'block';
        }
    }

    function goToPage2() {
        document.getElementById('page-1').style.display = 'none';
        document.getElementById('page-2').style.display = 'block';

        // Через 5 секунд показываем кнопку "Фоточки"
        setTimeout(() => {
            document.getElementById('photo-trigger').style.display = 'inline-block';
        }, 5000);
    }

    function showGallery() {
        const container = document.getElementById('main-container');
        const page2 = document.getElementById('page-2');
        const page3 = document.getElementById('page-3');
        const btn = document.getElementById('photo-trigger'); 
                // 1. Поднимаем рамку вверх container.classList.add('move-up');
                // 2. Через небольшую паузу убираем текст и показываем фото
        setTimeout(() => {
            page2.style.display = 'none';
            btn.style.display = 'none';
            page3.style.display = 'block';
        }, 500);
    }
</script>
